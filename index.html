<!DOCTYPE html>
<html lang="id">
<head>

  <style>

      background-attachment: fixed;

      margin: 0; 
      padding: 30px 15px; 
      min-height: 100vh;
      display: flex; 
      justify-content: center;

    .card {

      backdrop-filter: blur(8px);
      padding: 35px 30px; 
      border-radius: 16px; 
      max-width: 520px; 
      width: 100%; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2); 
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .header-container {

      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header-logo {
      width: 65px;
      height: auto;
      object-fit: contain;
    }

    .header-text {
      text-align: left;
    }

    .header-text h2 { 
      color: #1e293b; 
      margin: 0 0 2px 0; 
      font-size: 20px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header-text p {
      margin: 0;
      color: #1e293b; 
      font-size: 16px; 
      font-weight: 700; 
      line-height: 1.2;
    }

    label { 
      font-weight: 600; 
      font-size: 13px; 
      color: #334155; 
      display: block; 
      margin-top: 16px; 
    }

    .required-star {
      color: #e11d48;
      font-weight: bold;
    }

    input, select, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      margin-top: 6px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 14px; 
      background-color: #ffffff; 
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .phone-input-container {
      display: flex;
      align-items: center;
      margin-top: 6px;
    }

    .phone-prefix {
      padding: 12px 14px;
      background-color: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-right: none;
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
    }

    .phone-input-container input {
      margin-top: 0;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    button { 
      width: 100%; 
      background: linear-gradient(135deg, #25D366, #128C7E); 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 15px; 
      font-weight: 700; 
      border-radius: 8px; 
      margin-top: 28px; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover { 
      background: linear-gradient(135deg, #22bf5b, #0e7065); 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.4);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
