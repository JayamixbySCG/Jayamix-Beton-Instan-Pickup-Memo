<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jayamix by SCG Beton Instan Pickup Memo</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    body { 
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                  url('https://scgcbm.id/wp-content/uploads/2023/10/Beton-Instan-Jayamix-by-SCG.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      margin: 0; 
      padding: 30px 15px; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center;
    }

    .card { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(8px);
      padding: 35px 30px; 
      border-radius: 16px; 
      max-width: 520px; 
      width: 100%; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2); 
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header-logo {
      width: 65px;
      height: auto;
      object-fit: contain;
    }

    .header-text {
      text-align: left;
    }

    .header-text h2 { 
      color: #1e293b; 
      margin: 0 0 2px 0; 
      font-size: 20px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header-text p {
      margin: 0;
      color: #1e293b; 
      font-size: 16px; 
      font-weight: 700; 
      line-height: 1.2;
    }

    label { 
      font-weight: 600; 
      font-size: 13px; 
      color: #334155; 
      display: block; 
      margin-top: 16px; 
    }

    .required-star {
      color: #e11d48;
      font-weight: bold;
    }

    input, select { 
      width: 100%; 
      padding: 12px 14px; 
      margin-top: 6px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 14px; 
      background-color: #ffffff; 
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Container khusus untuk input nomor telepon ber-prefix +62 */
    .phone-input-container {
      display: flex;
      align-items: center;
      margin-top: 6px;
    }

    .phone-prefix {
      padding: 12px 14px;
      background-color: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-right: none;
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
    }

    .phone-input-container input {
      margin-top: 0;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    button { 
      width: 100%; 
      background: linear-gradient(135deg, #25D366, #128C7E); 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 15px; 
      font-weight: 700; 
      border-radius: 8px; 
      margin-top: 28px; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover { 
      background: linear-gradient(135deg, #22bf5b, #0e7065); 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.4);
    }

    button:active { transform: translateY(0); }

    .product-row {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      background: #f8fafc;
    }

    .product-row label { margin-top: 4px; }
    .product-row input { margin-bottom: 8px; }

    .add-product-button, .remove-product-button {
      width: auto;
      margin-top: 12px;
      padding: 9px 12px;
      font-size: 13px;
      box-shadow: none;
      display: inline-flex;
    }

    .add-product-button { background: #2563eb; }
    .add-product-button:hover { background: #1d4ed8; box-shadow: none; }

    .remove-product-button {
      background: #e2e8f0;
      color: #334155;
      margin-top: 4px;
    }
    .remove-product-button:hover { background: #cbd5e1; box-shadow: none; }

    .product-section-label { margin-top: 16px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-container">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Jayamix_by_SCG_logo.png" alt="Jayamix Logo" class="header-logo">
      <div class="header-text">
        <h2>Jayamix by SCG</h2>
        <p>Beton Instan Pickup Memo</p>
      </div>
    </div>

    <form id="memoForm" novalidate>
      
      <label for="customerName">Customer Name <span class="required-star">*</span></label>
      <input type="text" id="customerName" placeholder="Ex: PT. SCG Readymix Indonesia" required>

      <label class="product-section-label">Products and Quantity <span class="required-star">*</span></label>
      <div id="productsContainer">
        <div class="product-row">
          <label for="product-1">Product 1 <span class="required-star">*</span></label>
          <input type="text" id="product-1" class="product-name" placeholder="Ex: Normal Beton Instan K350 Split" required>
          <label for="qty-1">Qty (bags) <span class="required-star">*</span></label>
          <input type="number" id="qty-1" class="product-qty" min="1" step="1" placeholder="Enter quantity in multiples of 1" required>
        </div>
      </div>
      <button type="button" id="addProductButton" class="add-product-button">+ Add Product</button>

      <!-- NEW: Project Address -->
      <label for="projectAddress">Project Address <span class="required-star">*</span></label>
      <input type="text" id="projectAddress" placeholder="Ex: Ruko Pinang, Jl. Pinang No. 1, Kec. Pinang, Kota Tangerang" required>

      <label for="pickupPoint">Pickup Point <span class="required-star">*</span></label>
      <select id="pickupPoint" required>
        <option value="">-- Select Pickup Point --</option>
        <option value="East Jakarta">East Jakarta</option>
        <option value="Surabaya">Surabaya</option>
        <option value="Karawang">Karawang</option>
      </select>

      <label for="pickupDate">Pickup Date <span class="required-star">*</span></label>
      <input type="date" id="pickupDate" required>

      <label for="pickupHour">Pickup Hour <span class="required-star">*</span></label>
      <input type="time" id="pickupHour" required>

      <label for="driverName">Driver Name <span class="required-star">*</span></label>
      <input type="text" id="driverName" placeholder="Ex: Prabowo Subianto" required>

      <label for="driverContact">Driver Contact <span class="required-star">*</span></label>
      <div class="phone-input-container">
        <span class="phone-prefix">+62</span>
        <input type="tel" id="driverContact" placeholder="81234567890" required>
      </div>

      <label for="fleet">Fleet <span class="required-star">*</span></label>
      <select id="fleet" required>
        <option value="">-- Select Fleet Type --</option>
        <option value="Motorcycle">Motorcycle</option>
        <option value="MPV">MPV</option>
        <option value="Van">Van</option>
        <option value="Pickup">Pickup</option>
        <option value="Pickup box">Pickup box</option>
        <option value="CDE box">CDE box</option>
        <option value="CDE 3 ways">CDE 3 ways</option>
        <option value="CDD box">CDD box</option>
        <option value="CDD 3 ways">CDD 3 ways</option>
        <option value="CDD flatbed">CDD flatbed</option>
        <option value="Fuso box">Fuso box</option>
        <option value="Fuso 3 ways">Fuso 3 ways</option>
        <option value="Fuso flatbed">Fuso flatbed</option>
        <option value="Tronton wingbox">Tronton wingbox</option>
        <option value="Tronton box">Tronton box</option>
        <option value="Tronton 3 ways">Tronton 3 ways</option>
        <option value="Tronton flatbed">Tronton flatbed</option>
        <option value="Trailer 20ft container">Trailer 20ft container</option>
        <option value="Trailer 20ft 3 ways">Trailer 20ft 3 ways</option>
        <option value="Trailer 20ft flatbed">Trailer 20ft flatbed</option>
        <option value="Trailer 40ft container">Trailer 40ft container</option>
        <option value="Trailer 40ft 3 ways">Trailer 40ft 3 ways</option>
        <option value="Trailer 40ft flatbed">Trailer 40ft flatbed</option>
      </select>

      <label for="vehicleNo">Vehicle No. <span class="required-star">*</span></label>
      <input type="text" id="vehicleNo" placeholder="Ex: B9988YUI" required>

      <button type="submit">
        Send Memo via WhatsApp
      </button>
    </form>
  </div>

  <script>
    const NOMOR_WA_TUJUAN = "6285723660272";
    const productsContainer = document.getElementById('productsContainer');
    const addProductButton = document.getElementById('addProductButton');
    let productCounter = 1;

    // Tambah baris produk baru.
    addProductButton.addEventListener('click', function() {
      productCounter++;
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <label for="product-${productCounter}">Product ${productCounter} <span class="required-star">*</span></label>
        <input type="text" id="product-${productCounter}" class="product-name" placeholder="Enter product name" required>
        <label for="qty-${productCounter}">Qty (bags) <span class="required-star">*</span></label>
        <input type="number" id="qty-${productCounter}" class="product-qty" min="1" step="1" placeholder="Enter quantity in multiples of 1" required>
        <button type="button" class="remove-product-button">Remove Product</button>
      `;
      productsContainer.appendChild(row);
      row.querySelector('.remove-product-button').addEventListener('click', function() {
        row.remove();
        updateProductLabels();
      });
      row.querySelector('.product-name').focus();
    });

    function updateProductLabels() {
      const rows = productsContainer.querySelectorAll('.product-row');
      rows.forEach((row, index) => {
        const number = index + 1;
        const nameInput = row.querySelector('.product-name');
        const qtyInput = row.querySelector('.product-qty');
        row.querySelector('label[for^="product-"]').innerHTML = `Product ${number} <span class="required-star">*</span>`;
        row.querySelector('label[for^="qty-"]').innerHTML = `Qty (bags) <span class="required-star">*</span>`;
        nameInput.id = `product-${number}`;
        qtyInput.id = `qty-${number}`;
        row.querySelectorAll('label')[0].htmlFor = nameInput.id;
        row.querySelectorAll('label')[1].htmlFor = qtyInput.id;
      });
      productCounter = rows.length;
    }

    // Mencegah spasi pada Vehicle No.
    document.getElementById('vehicleNo').addEventListener('input', function() {
      this.value = this.value.replace(/\s+/g, '');
    });

    // Hanya angka; hapus awalan 0 atau 62 dari nomor yang dimasukkan.
    document.getElementById('driverContact').addEventListener('input', function() {
      let val = this.value.replace(/\D/g, '');
      if (val.startsWith('62')) {
        val = val.substring(2);
      } else if (val.startsWith('0')) {
        val = val.substring(1);
      }
      this.value = val;
    });

    document.getElementById('memoForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const inputs = [
        { id: 'customerName', name: 'Customer Name' },
        { id: 'projectAddress', name: 'Project Address' },
        { id: 'pickupPoint', name: 'Pickup Point' },
        { id: 'pickupDate', name: 'Pickup Date' },
        { id: 'pickupHour', name: 'Pickup Hour' },
        { id: 'driverName', name: 'Driver Name' },
        { id: 'driverContact', name: 'Driver Contact' },
        { id: 'fleet', name: 'Fleet' },
        { id: 'vehicleNo', name: 'Vehicle No.' }
      ];

      for (const item of inputs) {
        const field = document.getElementById(item.id);
        if (!field.value || field.value.trim() === '') {
          alert(`Please fill in the "${item.name}" field before submitting.`);
          field.focus();
          return;
        }
      }

      // Validasi semua baris produk dan qty.
      const productRows = Array.from(productsContainer.querySelectorAll('.product-row'));
      const products = [];
      for (let i = 0; i < productRows.length; i++) {
        const product = productRows[i].querySelector('.product-name').value.trim();
        const qtyField = productRows[i].querySelector('.product-qty');
        const qty = Number(qtyField.value);

        if (!product) {
          alert(`Please fill in the product name for Product ${i + 1}.`);
          productRows[i].querySelector('.product-name').focus();
          return;
        }
        if (!qtyField.value || !Number.isInteger(qty) || qty < 1) {
          alert(`Please enter a whole number of at least 1 for the quantity of Product ${i + 1}.`);
          qtyField.focus();
          return;
        }
        products.push({ product, qty });
      }

      const customerName = document.getElementById('customerName').value.trim();
      const projectAddress = document.getElementById('projectAddress').value.trim();
      const pickupPoint = document.getElementById('pickupPoint').value;
      const pickupDate = document.getElementById('pickupDate').value;
      const pickupHour = document.getElementById('pickupHour').value;
      const driverName = document.getElementById('driverName').value.trim();
      const driverContact = '+62' + document.getElementById('driverContact').value;
      const fleet = document.getElementById('fleet').value;
      const vehicleNo = document.getElementById('vehicleNo').value.trim();

      const productText = products.map((item, index) =>
        `${index + 1}. ${item.product} — ${item.qty} bags`
      ).join('\n');

      const pesan = `*Jayamix by SCG Beton Instan Pickup Memo*\n` +
                    `----------------------------------\n` +
                    `*Customer Name:* ${customerName}\n` +
                    `*Products & Qty:*\n${productText}\n` +
                    `*Project Address:* ${projectAddress}\n` +
                    `*Pickup Point:* ${pickupPoint}\n` +
                    `*Pickup Date:* ${pickupDate}\n` +
                    `*Pickup Hour:* ${pickupHour}\n` +
                    `*Driver Name:* ${driverName}\n` +
                    `*Driver Contact:* ${driverContact}\n` +
                    `*Fleet:* ${fleet}\n` +
                    `*Vehicle No.:* ${vehicleNo}\n` +
                    `----------------------------------\n` +
                    `Please process this need, thank you.`;

      const urlWA = `https://wa.me/${NOMOR_WA_TUJUAN}?text=${encodeURIComponent(pesan)}`;
      window.open(urlWA, '_blank');
    });
  </script>

</body>
</html>
```
